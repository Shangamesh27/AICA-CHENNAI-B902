
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>Chennai AICA _ Member Projects</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f8f9fb;
  color: #171c2c;
}
header {
  text-align: center;
  padding: 48px 20px 25px;
}
h1 {
  font-size: clamp(30px, 4vw, 52px);
  margin: 0 0 12px;
}
.subtitle {
  font-size: 19px;
  color: #4b5563;
  line-height: 1.5;
}
.container {
  max-width: 1450px;
  margin: auto;
  padding: 25px 30px 60px;
}
.search {
  display: block;
  width: 100%;
  max-width: 480px;
  margin: 15px auto 35px;
  padding: 14px;
  font-size: 16px;
  border: 1px solid #d5d9e2;
  border-radius: 9px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
}
.card {
  background: white;
  border: 1px solid #e2e5eb;
  border-radius: 10px;
  overflow: hidden;
}
.card-head {
  padding: 24px;
  min-height: 125px;
}
.card h2 {
  margin: 0 0 14px;
  font-size: 22px;
}
.creator {
  color: #667085;
  font-size: 14px;
}
.card-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  padding: 20px 24px;
  border-top: 1px solid #e2e5eb;
  background: #fafbfc;
}
.btn {
  display: block;
  text-align: center;
  padding: 14px 8px;
  border-radius: 7px;
  text-decoration: none;
  font-weight: bold;
}
.app {
  background: #5947dd;
  color: white;
}
.download { background: #eef0ff; color: #4434b5; border: 1px solid #5947dd; }
.btn:hover { opacity: 0.85; }
footer {
  text-align: center;
  padding: 25px;
  color: #667085;
  border-top: 1px solid #e5e7eb;
}
@media(max-width: 950px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
}
@media(max-width: 600px) {
  .grid { grid-template-columns: 1fr; }
  .container { padding: 20px; }
  .card-head { min-height: auto; }
}
.toolbar {display:flex;justify-content:center;}
button {font:inherit;cursor:pointer;border:1px solid #d5d9e2;border-radius:8px;padding:12px 18px;background:white;color:#253047;}
button:disabled {opacity:.6;cursor:wait;}
#status {text-align:center;color:#667085;margin:24px 0;}
.card h2 {overflow-wrap:anywhere;}
</style>
</head>
<body>

<header>
  <h1>Chennai AICA _ Member Projects</h1>
  <p class="subtitle">
    A Showcase of AI-Powered Web Applications<br>
    Developed by Chennai AiCA Batch Members
  </p>
</header>

<main class="container">
  <input class="search" id="search"
    type="search"
    placeholder="Search projects..."
    aria-label="Search projects">

  <div class="toolbar"><button id="refresh" type="button">Refresh projects</button></div>
<p id="status" role="status" aria-live="polite">Loading uploaded projects...</p>
<section class="grid" id="projects" aria-label="Uploaded projects"></section>
<noscript>Please enable JavaScript to view uploaded projects.</noscript>

</main>

<footer>
  Chennai AiCA Batch | AI Project Showcase
</footer>

<script>
'use strict';
const repository = 'Shangamesh27/AICA-CHENNAI-B902';
const branch = 'main';
const site = 'https://shangamesh27.github.io/AICA-CHENNAI-B902/';
const gallery = document.getElementById('projects');
const search = document.getElementById('search');
const status = document.getElementById('status');
const refresh = document.getElementById('refresh');
let projects = [];
let loaded = false;
const encodePath = path => path.split('/').map(encodeURIComponent).join('/');
const filename = path => path.split('/').pop();
const directory = path => path.includes('/') ? path.slice(0, path.lastIndexOf('/')) : '';
const stem = path => filename(path).replace(/\.[^.]+$/, '').trim();
function discover(files) {
  return files.filter(path => /\.html?$/i.test(path) && !/^index\.html?$/i.test(path)).map(app => {
    // File naming: App Name__CA Name.html (two underscores).
    // For index.html, use the same convention for the containing folder.
    const label = /^index$/i.test(stem(app)) ? filename(directory(app)) : stem(app);
    const separator = label.indexOf('__');
    const title = separator > 0 ? label.slice(0, separator) : label;
    const contributor = separator > 0 ? label.slice(separator + 2).replace(/_/g, ' ').trim() : '';
    return {name: title.replace(/[_-]+/g, ' ').trim(), contributor, app};
  }).sort((a, b) => a.name.localeCompare(b.name));
}
function render() {
  gallery.replaceChildren();
  const term = search.value.trim().toLowerCase();
  const filtered = projects.filter(project => (project.name + ' ' + project.contributor).toLowerCase().includes(term));
  for (const project of filtered) {
    const card = document.createElement('article');
    card.className = 'card';
    const head = document.createElement('div');
    head.className = 'card-head';
    const title = document.createElement('h2');
    title.textContent = project.name;
    head.append(title);
    if (project.contributor) {
      const creator = document.createElement('p');
      creator.className = 'creator';
      creator.textContent = 'Contributed by: ' + project.contributor;
      head.append(creator);
    }
    const actions = document.createElement('div');
    actions.className = 'card-actions';
    const link = document.createElement('a');
    link.className = 'btn app';
    link.textContent = 'View App';
    link.href = site + encodePath(project.app);
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.setAttribute('aria-label', 'View App: ' + project.name);
    const download = document.createElement('a');
    download.className = 'btn download';
    download.textContent = 'Download';
    download.href = link.href;
    download.download = filename(project.app);
    download.setAttribute('aria-label', 'Download: ' + project.name);
    actions.append(link, download);
    card.append(head, actions);
    gallery.append(card);
  }
  status.textContent = !projects.length ? 'No projects yet. Projects appear after an HTML app is uploaded.' :
    !filtered.length ? 'No projects match your search.' : filtered.length + (filtered.length === 1 ? ' project' : ' projects');
}
async function loadProjects() {
  refresh.disabled = true;
  gallery.setAttribute('aria-busy', 'true');
  status.textContent = 'Loading uploaded projects...';
  try {
    const response = await fetch('https://api.github.com/repos/' + repository + '/git/trees/' + branch + '?recursive=1', {cache: 'no-store'});
    if (!response.ok) throw new Error('Could not load projects');
    const data = await response.json();
    if (!Array.isArray(data.tree) || data.truncated) throw new Error('Incomplete project list');
    projects = discover(data.tree.filter(item => item.type === 'blob').map(item => item.path));
    loaded = true;
    render();
  } catch (error) {
    status.textContent = loaded ? 'Could not refresh projects. Showing the last loaded list. Please try again shortly.' : 'Projects could not be loaded. Please check your connection and select Refresh projects.';
  } finally {
    refresh.disabled = false;
    gallery.setAttribute('aria-busy', 'false');
  }
}
search.addEventListener('input', () => { if (loaded) render(); });
refresh.addEventListener('click', loadProjects);
loadProjects();
</script>

</body>
</html>
